services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command: --default-time-zone=+00:00 --log-bin-trust-function-creators=1
    ports: ["127.0.0.1:${MYSQL_PORT}:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs once, alphabetically, on an empty volume.
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_advanced.sql:/docker-entrypoint-initdb.d/02_advanced.sql:ro
      - ./sql/03_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27018:27017"]
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
volumes:
  mysql_data:
  mongo_data:
